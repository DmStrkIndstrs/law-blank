<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>특허법 조문 빈칸</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d1d1f;--sub:#6b6b70;--line:#e2dfd6;--acc:#1f5fbf;--acc2:#0b3f8f;--bl:#d6e2f5;--op:#e7f0ff;--ok:#2e8b57;--ng:#d2453d;--fs:17px}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2127;--tx:#e8e8ea;--sub:#9a9aa2;--line:#2c3038;--acc:#7fb0ff;--acc2:#a9ccff;--bl:#2b3a57;--op:#22304a;--ok:#5cc189;--ng:#ff7a70}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 0}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:15px;margin:22px 0 8px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.sub{margin:0;color:var(--sub);font-size:13px}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--acc);color:#fff;width:100%}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.grid{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 13px}
.row.rec{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.row .pc{font-size:12.5px;color:var(--sub);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
input[type=search],input[type=date],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
.set{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.set label{width:78px;color:var(--sub)}
.set input[type=range]{flex:1}
/* study */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);padding-top:max(9px,env(safe-area-inset-top))}
.top .lab{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 11px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin:12px 0;font-size:var(--fs);line-height:1.85;word-break:keep-all;overflow-wrap:anywhere}
.ah{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line);font-weight:700}
.ah .no{color:var(--acc)}
.ah .st{color:#e0a100;font-size:.82em;letter-spacing:1px}
.chap{font-size:12px;color:var(--sub);font-weight:400;width:100%}
.p{margin:.3em 0}
.l1{padding-left:1.1em}.l2{padding-left:2.2em}
.blank{background:var(--bl);color:transparent;border-bottom:2px solid var(--acc);border-radius:3px;padding:0 1px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.blank.open{background:var(--op);color:var(--acc2);font-weight:700}
.blank.hl{outline:2px solid var(--acc);outline-offset:1px}
.bb{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:9px 12px max(9px,env(safe-area-inset-bottom))}
.bb .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.25fr 1.25fr;gap:8px}
.bb button{border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:12px 4px;font-size:15px;font-weight:600}
.bb .ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.bb .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.cnt{font-size:12.5px;color:var(--sub);text-align:center;margin:-2px 0 6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:20;max-width:88%;text-align:center}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:44px}
.hint{font-size:12.5px;color:var(--sub);margin:6px 2px}
.badge{font-size:.72em;font-weight:800;border-radius:6px;padding:1px 7px;color:#fff}
.bv{background:#e08a00}.bw{background:var(--ng)}.bx{background:#888}.bo{background:var(--ok)}
</style>
</head>

function flush(){

function mergeRemote(r){
  r=r||{};
  var needWrite=false,changed=false;
  var rr=r.resetAt||0;
  if(rr>resetAt){resetAt=rr;LS.set('pt_reset',resetAt);prog={};changed=true}
  else if(rr<resetAt)needWrite=true;
  Object.keys(prog).forEach(function(k){if((prog[k].t||0)<resetAt&&resetAt>0){delete prog[k];changed=true}});
  var rp=r.prog||{};
  Object.keys(rp).forEach(function(k){
    var a=rp[k],b=prog[k];
    if((a.t||0)<resetAt&&resetAt>0)return;
    if(!b||(a.t||0)>(b.t||0)){prog[k]=a;changed=true}
    else if((b.t||0)>(a.t||0))needWrite=true;
  });
  Object.keys(prog).forEach(function(k){if(!rp[k])needWrite=true});
  var rc=r.cfg;
  if(rc&&(rc.t||0)>(cfg.t||0)){cfg=Object.assign({},cfg,rc);changed=true;LS.set('pt_cfg',cfg);applyCfg()}
  else if(!rc||(cfg.t||0)>(rc.t||0))needWrite=true;
  if(changed)LS.set('pt_prog',prog);
  return {changed:changed,needWrite:needWrite};
}

var ttsTok=0,ttsOn=false,ttsBtn=null;
function koVoice(){try{return speechSynthesis.getVoices().filter(function(v){return /^ko/i.test(v.lang)})[0]}catch(e){}}
function stopTTS(){ttsTok++;ttsOn=false;try{speechSynthesis.cancel()}catch(e){}if(ttsBtn)ttsBtn.textContent='🔊 듣기'}
function normSay(t,first){
  if(first){
    t=t.replace(/^\s*([①-⑳])/,function(m,c){return (c.charCodeAt(0)-0x245F)+'항 '});
    t=t.replace(/^\s*(\d+)\.\s/,'$1호 ').replace(/^\s*([가-하])\.\s/,'$1목 ');
  }
  return t.replace(/[ㆍ·]/g,', ').replace(/[()「」“”"']/g,' ').replace(/※/g,'참고 ').replace(/\s+/g,' ').trim();
}
function chunks(t){
  var out=[],cur='';
  t.split(' ').forEach(function(w){
    if((cur+' '+w).length>90&&cur){out.push(cur);cur=w}else cur=cur?cur+' '+w:w;
  });
  if(cur)out.push(cur);return out;
}
function buildQ(card){
  var q=[];
  Array.prototype.forEach.call(card.querySelectorAll('.ah,.p'),function(el){
    var first=el.classList.contains('p');
    el.childNodes.forEach(function(n){
      if(n.nodeType===3){
        var t=normSay(n.textContent,first);
        if(t){first=false;chunks(t).forEach(function(c){q.push({say:c})})}
      }else if(n.classList&&n.classList.contains('blank')){q.push({gap:n})}
      else if(n.classList&&(n.classList.contains('no')||n.classList.contains('ti'))){
        n.childNodes.forEach(function(m){
          if(m.nodeType===3){var t=normSay(m.textContent,false);if(t)q.push({say:t})}
          else if(m.classList&&m.classList.contains('blank'))q.push({gap:m});
        });
      }
    });
  });
  return q;
}
function startTTS(card,upd){
  if(!('speechSynthesis' in window)){toast('이 브라우저는 읽어주기를 지원하지 않아요');return}
  try{speechSynthesis.cancel()}catch(e){}
  ttsOn=true;var tok=++ttsTok;
  if(ttsBtn)ttsBtn.textContent='⏹ 멈춤';
  var q=buildQ(card);
  run(q,0,tok,upd);
}
function run(q,i,tok,upd){
  if(tok!==ttsTok)return;
  if(i>=q.length){
    if(deck&&deck.pos<deck.list.length-1){
      setTimeout(function(){if(tok!==ttsTok)return;deck.pos++;study(true)},900);
    }else{ttsOn=false;if(ttsBtn)ttsBtn.textContent='🔊 듣기'}
    return;
  }
  var it=q[i];
  if(it.say!==undefined){
    var u=new SpeechSynthesisUtterance(it.say);
    u.lang='ko-KR';u.rate=cfg.rate;var v=koVoice();if(v)u.voice=v;
    var fin=false,wd;
    var nx=function(){if(fin)return;fin=true;clearTimeout(wd);run(q,i+1,tok,upd)};
    u.onend=nx;
    u.onerror=function(e){
      if(e&&(e.error==='not-allowed'||e.error==='synthesis-failed'||e.error==='audio-busy')){
        fin=true;clearTimeout(wd);stopTTS();toast('이 화면에서는 소리가 막혀 있어요 (폰 브라우저/앱 확인)');
      }else nx();
    };
    wd=setTimeout(nx,20000);
    try{speechSynthesis.speak(u)}catch(e){stopTTS();toast('읽어주기를 시작하지 못했어요')}
  }else{
    var el=it.gap,ans=el.textContent;
    el.classList.add('hl');
    var ms=(1300+ans.length*170)/cfg.rate;
    setTimeout(function(){
      if(tok!==ttsTok)return;
      el.classList.remove('hl');el.classList.add('open');upd();
      q.splice(i+1,0,{say:normSay(ans,false)||ans});
      run(q,i+1,tok,upd);
    },ms);
  }
}

  xb.addEventListener('click',function(){var on=markX(a.no);toast(on?'X: 장별 보기·복습에서 빠져요':'X 해제');step(1)});
  var w=h('div',null,top,h('div',{class:'wrap',style:'padding-top:4px'},card,cnt,xb),bb);

  var x0=null,y0=null;
  w.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  w.addEventListener('touchend',function(e){
    if(x0==null)return;
    var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>90&&Math.abs(dy)<45)step(dx<0?1:-1);
  },{passive:true});
  mount(w);upd();
  if(keepTts){startTTS(card,upd)}
}

function finish(){
  if(deck.chap&&cfg.pos&&cfg.pos[deck.label]){delete cfg.pos[deck.label];saveCfg()}
  var d=0,x=0;deck.list.forEach(function(a){var s=st(a.no);if(s.v>0)x++;else if(s.seen||s.x)d++});
  var w=h('div',{class:'wrap'},h('div',{class:'done'},
    h('div',{class:'big'},'🎉'),h('h1',null,'끝까지 봤어요'),
    h('p',{class:'sub'},deck.label),
    h('p',null,'표시 없음/X '+d+'개 · V·W '+x+'개 / 전체 '+deck.list.length+'개')),
    h('div',{class:'grid'},
      h('button',{class:'btn',onclick:function(){var l=deck.list.filter(function(a){var s=st(a.no);return !s.x&&(s.v>0||!s.seen)});if(l.length)startDeck(deck.label+' (V·W·안 본 것)',l,0);else toast('V·W 표시가 없어요')}},'V·W·안 본 것만 다시'),
      h('button',{class:'btn ghost',onclick:function(){deck.pos=0;study()}},'처음부터 다시'),
      h('button',{class:'btn ghost',onclick:home},'홈으로')));
  mount(w);
}

home();
initSync();
})();
